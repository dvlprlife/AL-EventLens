# Dependabot keeps npm dependencies and GitHub Actions current via weekly,
# grouped PRs. These PRs are a human-reviewed stream OUTSIDE the agent label
# state machine (see agents/WORKFLOW.md) — they carry only `dependencies`,
# never `agent` / `status:*`. Routine minor+patch bumps are grouped to avoid
# PR spam; a breaking major still opens its own PR (Dependabot's default),
# giving a dedicated reviewable PR per major — the durable replacement for
# the manual dev-tooling-major sweeps tracked in #78.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      # @types/vscode is pinned to engines.vscode on purpose — it declares the
      # oldest VS Code we support, and typing against a newer API surface would
      # let code compile that fails at runtime on that baseline. `vsce package`
      # enforces this and hard-fails the Linux packaging smoke test:
      #   "@types/vscode ^1.125.0 greater than engines.vscode ^1.85.0"
      # so an unignored bump silently breaks every grouped dev-dep PR (it did,
      # in #170/#171). Raise this only in lockstep with engines.vscode, by hand.
      - dependency-name: "@types/vscode"
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
